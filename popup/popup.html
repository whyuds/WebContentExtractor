<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebContentExtractor</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <h1>WebContentExtractor</h1>
    
    <div class="actions">
      <button id="extractBtn" class="btn primary">Extract Content</button>
      <button id="manualBtn" class="btn secondary">Manual Selection</button>
    </div>
    
    <div class="rules-section">
      <div class="rules-header">
        <h2>Saved Rules</h2>
        <button id="manageRulesBtn" class="btn small">Manage</button>
      </div>
      
      <div id="rulesList" class="rules-list">
        <div class="loading">Loading rules...</div>
      </div>
    </div>
    
    <div id="noRules" class="no-rules hidden">
      <p>No rules saved for this domain.</p>
    </div>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
